#-----------------------------------------------------------#
# GitLab CI Rules                                           #
#                                                           #
# * For downstream forks (not on OpenRGBDevelopers/         #
#   OpenRGBVisualMapPlugin), run only if manually started   #
#   to save CI minutes if GitLab hosted runners             #
# * For commits to the OpenRGBDevelopers/                   #
#   OpenRGBVisualMapPlugin repository, automatically run    #
#   all jobs on the default branch, otherwise run them if   #
#   the source is part of a merge request                   #
#-----------------------------------------------------------#
.downstream_rules:
  rules:
  - if: $CI_PROJECT_PATH != "OpenRGBDevelopers/OpenRGBVisualMapPlugin" && $CI_PIPELINE_SOURCE == "push"
    when: manual
    allow_failure: true

.upstream_rules:
  rules:
  - if: '$CI_PROJECT_PATH == "OpenRGBDevelopers/OpenRGBVisualMapPlugin" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event")'
    when: on_success
  - !reference [.downstream_rules, rules]

.shared_windows_runners:
  tags:
  - shared-windows
  - windows
  - windows-1809

stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0

before_script:
 - echo "started by ${GITLAB_USER_NAME}"

 #reusable templates
.ccache_init: &ccache_init
  before_script:
    - export APPIMAGE_EXTRACT_AND_RUN=1

#-----------------------------------------------------------#
# Linux i386 Qt5 Build Target                               #
#-----------------------------------------------------------#
"Linux i386 Qt5":
  <<: *ccache_init
  image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:bookworm-i386
  tags:
  - linux
  - i386
  stage: build
  script:
  - export $(dpkg-architecture)
  - ./scripts/build-plugin.sh

  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_i386_Qt5_${CI_COMMIT_SHORT_SHA}"
    paths:
    - ./libOpenRGBVisualMapPlugin.so
    expire_in: 30 days

  rules:
    - !reference [.upstream_rules, rules]

